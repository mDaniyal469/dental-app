<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dr. Tahira Tanweer Dental Practice</title>
<meta name="description" content="Book a dental appointment, explore services, get emergency tooth advice and contact Dr. Tahira Tanweer Dental Practice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --bg:#F1F7F6; --surface:#FFFFFF; --surface2:#E4F0EE; --ink:#10302E; --muted:#4A6462; --line:#D2E1DE;
  --brand:#0B6B63; --on-brand:#FFFFFF; --brand-soft:#D3EDE9;
  --hero:#0C4E49; --on-hero:#FFFFFF;
  --gum:#B5304C; --on-gum:#FFFFFF; --gum-soft:#F9DDE3;
  --star:#E3A008; --ok:#1B7F4B; --ok-soft:#D8F0E1; --warn:#7A5300; --warn-soft:#FBEBC8;
  --focus:#0B6B63; --shadow:0 10px 30px rgba(12,78,73,.16);
  --fen:'Bricolage Grotesque','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --fd:'Bricolage Grotesque','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --fb:Figtree,'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0B1918; --surface:#132927; --surface2:#1A3532; --ink:#E7F3F1; --muted:#A3BDB9; --line:#264542;
    --brand:#4FCBBE; --on-brand:#06211E; --brand-soft:#173C38;
    --hero:#0F3D39; --on-hero:#FFFFFF;
    --gum:#F27C93; --on-gum:#2C0A12; --gum-soft:#3A1A22;
    --star:#F2B928; --ok:#63D394; --ok-soft:#153A29; --warn:#F2C868; --warn-soft:#3B2E10;
    --focus:#4FCBBE; --shadow:0 10px 30px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1918; --surface:#132927; --surface2:#1A3532; --ink:#E7F3F1; --muted:#A3BDB9; --line:#264542;
  --brand:#4FCBBE; --on-brand:#06211E; --brand-soft:#173C38;
  --hero:#0F3D39; --on-hero:#FFFFFF;
  --gum:#F27C93; --on-gum:#2C0A12; --gum-soft:#3A1A22;
  --star:#F2B928; --ok:#63D394; --ok-soft:#153A29; --warn:#F2C868; --warn-soft:#3B2E10;
  --focus:#4FCBBE; --shadow:0 10px 30px rgba(0,0,0,.45);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--fb);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--fd);line-height:1.15;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.7rem,5.5vw,2.4rem);font-weight:700}
h2{font-size:1.3rem;font-weight:700}
h3{font-size:1.02rem;font-weight:600}
h1:focus{outline:none}
p{margin:0}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.hero :focus-visible{outline-color:#fff}
.skip{position:absolute;inset-inline-start:-999px;top:0}
.skip:focus{inset-inline-start:12px;top:12px;background:var(--brand);color:var(--on-brand);padding:8px 12px;border-radius:8px;z-index:100}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.fill{fill:currentColor;stroke:none}
[dir="rtl"] .ic.flip{transform:scaleX(-1)}
bdi{unicode-bidi:isolate}

/* Urdu */
html[lang="ur"]{
  --fd:'Noto Nastaliq Urdu','Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif;
  --fb:'Noto Nastaliq Urdu','Noto Naskh Arabic','Segoe UI',Tahoma,sans-serif;
}
html[lang="ur"] body{line-height:2.15}
html[lang="ur"] *{letter-spacing:0!important}
html[lang="ur"] h1,html[lang="ur"] h2,html[lang="ur"] h3{line-height:1.95}
html[lang="ur"] h1{font-size:clamp(1.5rem,5vw,2.1rem)}
html[lang="ur"] h2{font-size:1.2rem}
html[lang="ur"] .hero h1{font-size:clamp(1.7rem,6.5vw,2.5rem);line-height:2.05;max-width:16ch}
html[lang="ur"] .tab{font-size:.78rem;line-height:1.8}
html[lang="ur"] .hint,html[lang="ur"] .rp{line-height:2}
html[lang="ur"] .btn,html[lang="ur"] .chip,html[lang="ur"] .slot,html[lang="ur"] .pill{line-height:1.9}
html[lang="ur"] .btn{padding-top:4px;padding-bottom:4px}

/* shell */
.shell{max-width:1080px;margin:0 auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;border-radius:12px;text-align:start}
.logo{width:40px;height:40px;border-radius:13px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.logo svg{width:23px;height:23px;fill:currentColor}
.brand b{display:block;font:700 1.02rem/1.2 var(--fd)}
.brand small{color:var(--muted);font-size:.8rem}
.tools{display:flex;align-items:center;gap:8px}
.iconbtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.langbtn{min-height:44px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;line-height:1.6}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 2px;border:0;background:none;color:var(--muted);font-size:.72rem;font-weight:600;border-radius:14px}
.tab .ic{width:23px;height:23px}
.ib{display:grid;place-items:center;width:50px;height:30px;border-radius:15px;transition:background .2s}
.tab[aria-current=page]{color:var(--brand)}
.tab[aria-current=page] .ib{background:var(--brand-soft)}
.tab.cta{color:var(--ink)}
.tab.cta .ib{background:var(--brand);color:var(--on-brand)}
.tab.cta[aria-current=page]{color:var(--brand)}
#app{padding:4px 16px 120px;outline:none}
.view.enter{animation:enter .25s ease}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-areas:"bar bar" "tabs main";column-gap:28px;padding:0 20px}
  .bar{grid-area:bar;padding-left:0;padding-right:0}
  .tabs{grid-area:tabs;position:sticky;left:auto;right:auto;bottom:auto;top:calc(72px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:4px;border:0;background:transparent;padding:0}
  .tab{flex-direction:row;gap:12px;font-size:.98rem;padding:10px 12px;justify-content:flex-start}
  html[lang="ur"] .tab{font-size:.92rem}
  .ib,.tab.cta .ib{width:auto;height:auto;background:none;color:inherit}
  .tab.cta{background:var(--brand);color:var(--on-brand)}
  .tab.cta[aria-current=page]{color:var(--on-brand)}
  .tab[aria-current=page]{background:var(--brand-soft)}
  .tab.cta[aria-current=page]{background:var(--brand)}
  #app{grid-area:main;padding:4px 0 60px}
}

/* buttons and forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:14px;border:1.5px solid transparent;font-weight:700;text-decoration:none;background:var(--brand);color:var(--on-brand)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.soft{background:var(--brand-soft);color:var(--brand)}
.btn.light{background:#fff;color:#0C4E49}
.btn.line{background:transparent;border-color:rgba(255,255,255,.6);color:#fff}
.btn.danger{background:transparent;border-color:var(--gum);color:var(--gum)}
.btn.gum{background:var(--gum);color:var(--on-gum)}
.btn.sm{min-height:40px;padding:0 14px;font-size:.92rem;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--brand);font-weight:700;text-decoration:underline;padding:6px}
.field{display:grid;gap:6px;margin-bottom:14px}
label,.lbl{font-weight:600;font-size:.95rem}
input[type=text],input[type=tel],textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface)}
textarea{min-height:92px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.8}
.hint{color:var(--muted);font-size:.9rem}
.err{color:var(--gum);font-weight:600;font-size:.9rem}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:14px;background:var(--surface2)}
.seg button{border:0;background:none;padding:9px 14px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding-bottom:0}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.chip[aria-pressed=true]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}

/* hero + quick booking */
.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--on-hero);border-radius:28px;padding:26px 22px 78px;margin-top:4px}
.hero h1{font-size:clamp(2rem,7vw,3rem);max-width:14ch;position:relative}
.hero p{margin-top:10px;color:rgba(255,255,255,.86);max-width:34ch;position:relative}
.hero .wm{position:absolute;inset-inline-end:-30px;bottom:-40px;width:250px;height:250px;fill:none;stroke:rgba(255,255,255,.16);stroke-width:.6;stroke-linejoin:round;transform:rotate(-14deg);pointer-events:none}
.hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.3}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;position:relative}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.15);font-size:.9rem;font-weight:600}
.pill .ic{width:16px;height:16px;color:#FFD766}
.pill .dot{width:8px;height:8px;border-radius:50%;background:#7EE2A8}
.pill .dot.off{background:#F5A3B1}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;position:relative}
.quick{position:relative;margin:-52px 12px 0;background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.dayrow{display:flex;gap:8px;overflow-x:auto;padding:10px 2px;scrollbar-width:none}
.day{flex:0 0 auto;min-width:58px;display:flex;flex-direction:column;align-items:center;padding:8px 6px;border:1px solid var(--line);background:var(--surface);border-radius:14px}
.day .dw{font-size:.74rem;color:var(--muted);font-weight:600;line-height:1.8}
.day .dn{font:700 1.2rem/1.2 var(--fen)}
.day[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.day[aria-pressed=true] .dw{color:inherit;opacity:.9}
.day:disabled{opacity:.4;cursor:not-allowed}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.slot{min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);font-weight:600}
.slot[aria-pressed=true]{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.mt{margin-top:12px}
.mt2{margin-top:20px}

/* sections and lists */
.sec{margin-top:28px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.pgt{margin:10px 0 14px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:22px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:start;text-decoration:none;color:var(--ink);font-weight:600}
.bub{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex:none}
.tile.em .bub,.bub.em{background:var(--gum-soft);color:var(--gum)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:start;text-decoration:none;color:var(--ink)}
.list>.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row p{color:var(--muted);font-size:.92rem}
.row p.price{color:var(--ink);font-weight:700;font-size:.95rem;margin-top:2px}
.price{font:700 1rem var(--fen);white-space:nowrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px}
.card .doc{margin-bottom:12px}
.card .avatar{width:64px;height:64px;border-radius:20px;font-size:1.5rem}
.rt{display:block;font:600 1.02rem/1.25 var(--fd)}
.rp{display:block;color:var(--muted);font-size:.92rem}
html[lang="ur"] .rt{line-height:1.95}
.empty{padding:22px;text-align:center;color:var(--muted)}
.gt{font-weight:600;color:var(--muted);padding:16px 4px 8px}
.pick{display:flex;align-items:center;gap:12px;width:100%;text-align:start;padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--line)}
.list>.pick:last-child{border-bottom:0}
.pick[aria-pressed=true]{background:var(--brand-soft)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.tick .ic{width:14px;height:14px;stroke-width:3;opacity:0}
.pick[aria-pressed=true] .tick{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pick[aria-pressed=true] .tick .ic{opacity:1}
.stephead{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.prog{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-bottom:18px}
.prog i{display:block;height:100%;background:var(--brand);transition:width .3s}
.prog i.w1{width:25%}.prog i.w2{width:50%}.prog i.w3{width:75%}.prog i.w4{width:100%}
.banner{display:flex;align-items:center;gap:10px;background:var(--brand-soft);border-radius:14px;padding:8px 14px;margin-bottom:12px}
.banner .link{margin-inline-start:auto}
.stepnav{display:flex;gap:10px;margin-top:20px}
.stepnav .btn{flex:1}
.sum{margin:0}
.sum div{display:flex;justify-content:space-between;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line)}
.sum div:last-child{border-bottom:0}
.sum dt{color:var(--muted)}
.sum dd{margin:0;font-weight:600;text-align:end;overflow-wrap:anywhere}
.stack{display:grid;gap:10px}
.done{display:grid;justify-items:center;text-align:center;gap:12px;padding:20px 0 6px}
.done-ic{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.done-ic .ic{width:38px;height:38px;stroke-width:3;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.gallery{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.gallery figure{margin:0;flex:0 0 78%;max-width:340px;scroll-snap-align:start}
.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;display:block;background:var(--surface2)}
.gallery figcaption{font-size:.8rem;color:var(--muted);margin-top:6px}

/* visits */
.visit{display:grid;grid-template-columns:64px 1fr;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}
.vdate{border-radius:14px;background:var(--brand-soft);color:var(--brand);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0}
.vdate b{font:700 1.6rem/1 var(--fen)}
.vdate span{font-size:.8rem;font-weight:700;line-height:1.8}
.vbody p{color:var(--muted);font-size:.93rem}
.vact{display:flex;flex-wrap:wrap;gap:8px;grid-column:1/-1}
.confirm{grid-column:1/-1;display:grid;gap:10px;background:var(--gum-soft);border-radius:14px;padding:12px}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:700;margin-top:6px}
.b-req{background:var(--warn-soft);color:var(--warn)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-off{background:var(--surface2);color:var(--muted)}

/* info pages */
.acc{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.acc summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;align-items:center;justify-content:space-between;gap:10px}
.acc summary::-webkit-details-marker{display:none}
.acc summary .ic{transition:transform .2s;color:var(--muted)}
.acc[open] summary .ic{transform:rotate(90deg)}
[dir="rtl"] .acc summary .ic{transform:scaleX(-1)}
[dir="rtl"] .acc[open] summary .ic{transform:scaleX(-1) rotate(90deg)}
.accb{padding:0 16px 16px}
.accb ul{margin:8px 0 0;padding-inline-start:20px}
.accb li{margin:6px 0}
.alert{background:var(--gum-soft);border:1.5px solid var(--gum);border-radius:18px;padding:16px;display:grid;gap:12px;margin-bottom:16px}
.doc{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.avatar{width:84px;height:84px;border-radius:26px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:700 1.9rem var(--fen);flex:none}
img.avatar{object-fit:cover;display:block}
.rate{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.bigrate{font:700 3.4rem/1 var(--fen)}
.stars{display:flex;gap:2px;color:var(--star)}
.stars .ic{width:22px;height:22px}
.hours div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.hours div:last-child{border-bottom:0}
.hours .today{font-weight:700;color:var(--brand)}
#toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:min(92vw,440px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast a{color:inherit}
@media (min-width:900px){#toast{bottom:calc(28px + env(safe-area-inset-bottom,0px))}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.done-ic .ic{stroke-dashoffset:0}}
</style>
</head>
<body>
<a class="skip" href="#app" id="skip"></a>
<div class="shell">
  <header class="bar">
    <button class="brand" data-a="go" data-v="home" id="brandBtn">
      <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="logo-path" d=""/></svg></span>
      <span><b id="brandName"></b><small id="brandSub"></small></span>
    </button>
    <div class="tools">
      <button class="langbtn" id="langBtn" data-a="lang"></button>
      <button class="iconbtn" id="themeBtn" data-a="theme"></button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="app" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Clinic settings: edit these to update the app ----------
   Text that can be translated is written as ['English','اردو'].
   Lists are written as {en:[...],ur:[...]}. */
var CONFIG={
  name:['Dr. Tahira Tanweer Dental Practice','ڈاکٹر طاہرہ تنویر ڈینٹل پریکٹس'],
  phoneDisplay:'+92 328 5264911',
  phoneTel:'+923285264911',
  whatsapp:'923285264911',
  rating:5,

function pad(n){return String(n).padStart(2,'0')}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}

function mins(t){var p=t.split(':').map(Number);return p[0]*60+p[1]}
function t12(t){
  var p=t.split(':').map(Number),h=p[0],hh=(h%12||12)+':'+pad(p[1]);
  if(lang==='ur')return hh+' '+(h<12?'صبح':(h<16?'دوپہر':'شام'));
  return hh+' '+(h>=12?'pm':'am');
}

/* ---------- availability ---------- */
function hoursFor(d){return CONFIG.hours[d.getDay()]||null}
function slotsFor(dateIso){
  var d=fromIso(dateIso),h=hoursFor(d),out=[];
  if(!h)return out;
  var limit=Date.now()+CONFIG.leadMinutes*60000;
  for(var m=mins(h[0]);m+CONFIG.slotMinutes<=mins(h[1]);m+=CONFIG.slotMinutes){
    var t=pad(Math.floor(m/60))+':'+pad(m%60);
    var when=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(m/60),m%60).getTime();
    if(when<limit)continue;
    var taken=appts.some(function(a){return a.status!=='cancelled'&&a.date===dateIso&&a.time===t&&a.id!==state.draft.reschedule});
    out.push({t:t,taken:taken});
  }
  return out;
}
function hasSlots(dateIso){return slotsFor(dateIso).some(function(s){return !s.taken})}
function days(){
  var out=[],base=new Date();base.setHours(0,0,0,0);
  for(var i=0;i<CONFIG.daysAhead;i++){var d=new Date(base);d.setDate(base.getDate()+i);out.push({iso:iso(d),d:d,closed:!hoursFor(d),i:i})}
  return out;
}
function openStatus(){
  var now=new Date(),h=hoursFor(now),cur=now.getHours()*60+now.getMinutes();
  if(h&&cur>=mins(h[0])&&cur<mins(h[1]))return {open:true,text:T('Open now, until '+t12(h[1]),'ابھی کھلا ہے، '+t12(h[1])+' تک')};
  if(h&&cur<mins(h[0]))return {open:false,text:T('Closed, opens today at '+t12(h[0]),'بند ہے، آج '+t12(h[0])+' پر کھلے گا')};
  for(var i=1;i<=7;i++){var d=new Date(now);d.setDate(now.getDate()+i);var hh=hoursFor(d);if(hh)return {open:false,text:T('Closed, opens '+(i===1?'tomorrow':dn(d.getDay()))+' at '+t12(hh[0]),'بند ہے، '+(i===1?'کل':dn(d.getDay())+' کو')+' '+t12(hh[0])+' پر کھلے گا')}}
  return {open:false,text:T('Closed','بند ہے')};
}
function apptDate(a){var d=fromIso(a.date),p=a.time.split(':').map(Number);d.setHours(p[0],p[1]);return d}
function isUpcoming(a){return a.status!=='cancelled'&&apptDate(a).getTime()>Date.now()-30*60000}

    h+='<div class="field"><label for="f-name">'+T('Your name','آپ کا نام')+'</label><input id="f-name" type="text" data-f="name" value="'+esc(d.name)+'" autocomplete="name">'+err('name')+'</div>';

var VIEWS={prices:vPrices,home:vHome,services:vServices,book:vBook,visits:vVisits,more:vMore,doctor:vDoctor,emergency:vEmergency,care:vCare,aftercare:vAftercare,faq:vFaq,reviews:vReviews,contact:vContact,privacy:vPrivacy};
var MORE_SUB=['doctor','prices','emergency','care','aftercare','faq','reviews','contact','privacy'];
function tabOf(v){return MORE_SUB.indexOf(v)>=0?'more':v}

function buildTabs(){
  var TABS=[['home','home',T('Home','ہوم')],['services','list',T('Services','خدمات')],['book','cal',T('Book','بک کریں')],['visits','clock',T('Visits','ملاقاتیں')],['more','more',T('More','مزید')]];
  $('#tabs').setAttribute('aria-label',T('Main','مین مینو'));
  $('#tabs').innerHTML=TABS.map(function(t){return '<button class="tab'+(t[0]==='book'?' cta':'')+'" data-a="go" data-v="'+t[0]+'" aria-label="'+t[2]+'"><span class="ib">'+ic(t[1])+'</span>'+t[2]+'</button>'}).join('');
}
function effectiveTheme(){return document.documentElement.getAttribute('data-theme')||(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}
function paintChrome(){
  var root=document.documentElement;
  root.setAttribute('lang',lang);root.setAttribute('dir',lang==='ur'?'rtl':'ltr');
  document.title=clinicName();
  $('#brandName').textContent=PL(CONFIG.doctor.name);
  $('#brandSub').textContent=T('Dental Practice','ڈینٹل پریکٹس');
  $('#brandBtn').setAttribute('aria-label',T('Go to home','ہوم پر جائیں'));
  $('#skip').textContent=T('Skip to content','مواد پر جائیں');
  var lb=$('#langBtn');lb.textContent=lang==='ur'?'English':'اردو';lb.setAttribute('aria-label',lang==='ur'?'Switch to English':'اردو میں دیکھیں');lb.setAttribute('lang',lang==='ur'?'en':'ur');
  var dark=effectiveTheme()==='dark',b=$('#themeBtn');
  b.innerHTML=ic(dark?'sun':'moon');b.setAttribute('aria-label',dark?T('Switch to light mode','روشن موڈ پر جائیں'):T('Switch to dark mode','گہرا (ڈارک) موڈ پر جائیں'));
  buildTabs();
}

function render(enter){
  var app=$('#app');
  app.innerHTML='<div class="view'+(enter?' enter':'')+'">'+VIEWS[state.view]()+'</div>';
  var cur=tabOf(state.view);
  document.querySelectorAll('.tab').forEach(function(b){b.setAttribute('aria-current',b.dataset.v===cur?'page':'false')});
  if(enter){window.scrollTo(0,0);var h=app.querySelector('h1');if(h)h.focus({preventScroll:true})}
}
function go(v){
  if(v==='book'&&state.draft.doneId)state.draft=newDraft();
  state.errors={};state.confirmCancel=null;state.confirmClear=false;
  state.view=v;
  try{if(location.hash.slice(1)!==v)location.hash=v}catch(e){}
  render(true);
}
function setLang(l){lang=l;store.set('dtd.lang',l);paintChrome();render(false)}

/* ---------- toast ---------- */
var tt;
function toast(msg,isHtml){
  var el=$('#toast');el.innerHTML=isHtml?msg:esc(msg);el.classList.add('on');
  clearTimeout(tt);tt=setTimeout(function(){el.classList.remove('on')},5200);
}

/* ---------- appointments ---------- */
function validateDetails(){
  var d=state.draft,e={};
  if(d.name.trim().length<2)e.name=T('Enter your name.','اپنا نام لکھیں۔');
  var digits=d.phone.replace(/\D/g,'');
  if(digits.length<10||digits.length>13)e.phone=T('Enter a phone number the clinic can reach, like 0300 1234567.','کلینک کے رابطے کے لیے فون نمبر لکھیں، جیسے 0300 1234567۔');
  if(d.forWho==='other'&&d.patientName.trim().length<2)e.patientName=T('Enter the patient\u2019s name.','مریض کا نام لکھیں۔');
  if(d.age.trim()&&!/^\d{1,3}$/.test(d.age.trim()))e.age=T('Enter the age in years, like 34.','عمر سالوں میں لکھیں، جیسے 34۔');
  state.errors=e;
  return !Object.keys(e).length;
}
function commit(sent){
  var d=state.draft;
  if(d.doneId)return;
  var a=apptFromDraft();
  a.id='a'+Date.now().toString(36);a.status='requested';a.created=Date.now();
  if(d.reschedule){appts.forEach(function(x){if(x.id===d.reschedule)x.status='cancelled'})}
  appts.push(a);store.set('dtd.appts',appts);
  profile={name:a.name,phone:a.phone,age:a.forWho==='me'?a.age:(profile.age||'')};store.set('dtd.profile',profile);
  d.doneId=a.id;d.sent=sent;
}
function startFrom(a,step){
  var d=newDraft();
  d.service=a.serviceId;d.name=a.name;d.phone=a.phone;d.age=a.age||'';d.forWho=a.forWho;d.patientName=a.patientName||'';d.ptype=a.ptype;
  d.concerns=(a.concerns||[]).map(function(c){return CONCERNS.map(function(x){return x[0]}).indexOf(c)}).filter(function(i){return i>=0});
  d.notes=a.notes||'';d.medical=a.medical||'';d.step=step;
  return d;
}
function apptById(id){return appts.filter(function(y){return y.id===id})[0]}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t)return;
  var a=t.dataset.a,v=t.dataset.v,d=state.draft;
  switch(a){
    case 'go':go(v);break;
    case 'lang':setLang(lang==='ur'?'en':'ur');break;
    case 'theme':(function(){var next=effectiveTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);store.set('dtd.theme',next);paintChrome();render(false)})();break;
    case 'homeDay':state.homeDate=v;render();break;
    case 'quick':state.draft=newDraft();state.draft.date=state.homeDate;state.draft.time=v;go('book');break;
    case 'quickMore':state.draft=newDraft();state.draft.date=state.homeDate;state.draft.step=1;go('book');break;
    case 'bookSvc':state.draft=newDraft();state.draft.service=v;state.draft.step=2;go('book');break;
    case 'pickSvc':d.service=v;d.step=2;render(true);break;
    case 'pickDay':d.date=v;d.time=null;render();break;
    case 'pickTime':d.time=v;render();break;
    case 'stepBack':if(d.step>1){d.step--;state.errors={};render(true)}else go(d.reschedule?'visits':'home');break;
    case 'stepNext':
      if(d.step===2&&!(d.date&&d.time))break;
      if(d.step===3&&!validateDetails()){render();var first=$('.err');if(first&&first.scrollIntoView)first.scrollIntoView({block:'center'});break}
      d.step++;render(true);break;
    case 'forWho':d.forWho=v;render();break;
    case 'ptype':d.ptype=v;render();break;
    case 'toggleConcern':(function(){var i=+v,k=d.concerns.indexOf(i);if(k>=0)d.concerns.splice(k,1);else d.concerns.push(i);render()})();break;
    case 'send':commit(true);setTimeout(function(){render(true)},250);break;
    case 'saveOnly':commit(false);render(true);break;
    case 'visitsTab':state.visitsTab=v;state.confirmCancel=null;render();break;
    case 'cancelAsk':state.confirmCancel=v;render();break;
    case 'cancelNo':state.confirmCancel=null;render();break;
    case 'cancelYes':(function(){var x=apptById(v);if(x){x.status='cancelled';store.set('dtd.appts',appts);state.confirmCancel=null;render();var m=T('Hello, I need to cancel my dental appointment on '+dayLong(x.date)+', '+t12(x.time)+' ('+x.service+').','السلام علیکم، مجھے '+dayLong(x.date)+'، '+t12(x.time)+' کی اپنی اپائنٹمنٹ ('+svcOfAppt(x)+') منسوخ کرنی ہے۔');toast(T('Visit cancelled.','ملاقات منسوخ ہو گئی۔')+' <a href="'+wa(m)+'" target="_blank" rel="noopener">'+T('Tell the clinic on WhatsApp','واٹس ایپ پر کلینک کو بتائیں')+'</a>',true)}})();break;
    case 'confirmed':(function(){var x=apptById(v);if(x){x.status='confirmed';store.set('dtd.appts',appts);render()}})();break;
    case 'resched':(function(){var x=apptById(v);if(x){state.draft=startFrom(x,2);state.draft.reschedule=x.id;go('book')}})();break;
    case 'again':(function(){var x=apptById(v);if(x){state.draft=startFrom(x,2);go('book')}})();break;
    case 'saveProfile':(function(){profile={name:$('#pf-name').value.trim(),phone:$('#pf-phone').value.trim(),age:$('#pf-age').value.trim()};store.set('dtd.profile',profile);if(!state.draft.doneId){state.draft.name=profile.name;state.draft.phone=profile.phone;state.draft.age=profile.age}toast(T('Details saved on this device.','تفصیل اس ڈیوائس پر محفوظ ہو گئی۔'))})();break;
    case 'clearAsk':state.confirmClear=true;render();break;
    case 'clearNo':state.confirmClear=false;render();break;
    case 'clearYes':appts=[];profile={name:'',phone:'',age:''};store.del('dtd.appts');store.del('dtd.profile');state.draft=newDraft();state.confirmClear=false;render();toast(T('Your data was erased from this device.','آپ کا ڈیٹا اس ڈیوائس سے مٹا دیا گیا۔'));break;
    case 'cat':state.cat=v;render();break;
  }
});
document.addEventListener('input',function(e){
  var f=e.target.dataset&&e.target.dataset.f;if(!f)return;
  var v=e.target.value;
  if(f==='q'){state.q=v;var l=$('#svc-list');if(l)l.innerHTML=svcRows(filtered());return}
  if(f==='fb'){state.fb=v;var k=$('#fb-link');if(k)k.href=wa(fbMsg());return}
  state.draft[f]=v;
});
window.addEventListener('hashchange',function(){
  var v=(location.hash||'').slice(1);
  if(VIEWS[v]&&v!==state.view){state.view=v;render(true)}
});

/* ---------- start ---------- */
$('#logo-path').setAttribute('d',TOOTH);
if(theme==='light'||theme==='dark')document.documentElement.setAttribute('data-theme',theme);
var savedLang=store.get('dtd.lang',null);
if(savedLang==='ur'||savedLang==='en')lang=savedLang;
else{try{if(/^ur/i.test(navigator.language||''))lang='ur'}catch(e){}}
paintChrome();
try{var h0=(location.hash||'').slice(1);if(VIEWS[h0])state.view=h0}catch(e){}
render(false);
})();
</script>
</body>
